# Actualizaciones automaticas de dependencias del backend y de las actions.
# Las actions estan fijadas por SHA: Dependabot abre el PR que las mueve a la version nueva.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - 'org.springframework.boot:*'

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
