# CI del backend (T-01.4). Corre en cada PR contra main y en cada push a main.
# El push a main es lo que mira Render ("Auto-Deploy: After CI Checks Pass").
#
# Los jobs siempre existen, pero se saltean si el cambio no toca el backend:
# un job salteado cuenta como aprobado para la proteccion de main, en cambio un
# workflow filtrado con "on.paths" dejaria el check en "pending" para siempre.
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Solo lectura del repo. Ningun job necesita secrets: la base de los tests es Testcontainers.
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  build-test:
    name: Build, tests y formato
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # verify = compilar + unitarios (surefire) + integracion con PostgreSQL real (failsafe)
      # + migraciones de Flyway sobre base limpia + formato (spotless:check)
      - name: mvn verify
        run: ./mvnw -B -ntp verify
      - name: Subir reportes de tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  migrations:
    name: Migraciones inmutables
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Una migracion ya aplicada nunca se edita, se renombra ni se borra: se agrega una nueva.
      # Flyway fallaria por checksum en Neon, o peor, el esquema divergiria entre entornos.
      - name: Verificar que no se modifiquen migraciones existentes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "$BASE_SHA"...HEAD -- backend/src/main/resources/db/migration/)
          if [ -n "$changed" ]; then
            echo "::error::Este PR modifica, renombra o borra migraciones existentes. Agregá una migración nueva en su lugar."
            echo "$changed"
            exit 1
          fi
          echo "OK: solo se agregan migraciones nuevas (o ninguna)."

  docker:
    name: Imagen Docker
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # La misma imagen que construye Render: si esto falla, el deploy tambien
      - name: docker build
        run: docker build -t turnos-backend:ci backend
      # Informativo: reporta CVEs de la imagen pero no bloquea el merge
      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: turnos-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
